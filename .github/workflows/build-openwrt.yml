name: Build GAPD-7500 images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "configs/openwrt-*"
      - "patches/official-openwrt/**"
      - "scripts/build/**"
      - ".github/workflows/build-openwrt.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-packaging python3-pyelftools python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Build and verify the pinned images
        env:
          GAPD_OPENWRT_BUILD_TREE: /home/runner/work/openwrt-gapd-build
        run: scripts/build/build-openwrt-gapd-7500.sh

      - name: Upload verified images
        uses: actions/upload-artifact@v4
        with:
          name: gapd-7500-openwrt
          path: artifacts/openwrt-gapd-7500-release/
          if-no-files-found: error
          retention-days: 14
